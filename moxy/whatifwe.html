<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RNG SEGAMD</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #reload-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      z-index: 1000;
    }
    #reload-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <button id="reload-btn">Reload</button>
  <div id="game"></div>
  <script>
    // ROM list
    const romList = [
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@master/retro/please_do_not_mind_about_this_folder/[SHC]%20[contest2025]%201379%20-%20Sonic%20Sudoku%20(credits%20to%20RetroKoH).bin",
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@master/retro/please_do_not_mind_about_this_folder/Large%20Levels%20Tech%20Demo(credits%20to%20giovanni.gen).bin",
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@master/retro/please_do_not_mind_about_this_folder/Sonic%202%20Black%20Guy%20Singing%20Edition(credits%20to%20Netkil).bin"
    ];

    // Function to reload the page
    function reloadPage() {
      location.reload();
    }

    // Attach click event to button
    document.getElementById("reload-btn").addEventListener("click", reloadPage);

    // Pick a random ROM on page load
    const randomRom = romList[Math.floor(Math.random() * romList.length)];

    // Configure EmulatorJS
    EJS_player = "#game";
    EJS_core = "segaMD";
    EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/";
    EJS_gameUrl = randomRom;
  </script>
  <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js"></script>
</body>
</html>
