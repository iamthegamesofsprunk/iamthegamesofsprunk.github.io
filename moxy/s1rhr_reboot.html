<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RNG SEGAMD</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #reload-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      z-index: 1000;
    }
    #reload-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <button id="reload-btn">Reload</button>
  <div id="game"></div>
  <script>
    // ROM list
    const romList = [
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/sonic-1-easy-mode/Sonic%20Easy%20Mode.zip",
      
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/white-sonic-in-sonic-1/WhiteSonic1Remade_Final(V1.24-Public_Release).bin",
      
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/please_do_not_mind_about_this_folder/amy-rose-in-sonic-the-hedgehog%20(Credits%20to%20E-122-Psi).bin",
      
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/sonic-1-hold-right-to-win-edition/Sonic1HoldRightToWinEdition.bin",
      
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/please_do_not_mind_about_this_folder/multi%20(Credits%20to%20MarkeyJester).bin",
      
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/sonic-1-the-ring-ride-1-2-3-%26-4/RingRide2.bin",
      
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/knuckles-in-sonic-1/Knuckles%20the%20Echidna%20in%20Sonic%20the%20Hedgehog%20by-stealth(S1%20Hack).BIN",
      
      "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@0e0689468e03808c3125d32de2b00b5b1575f899/An_Ordinary_Sonic_ROM_Hack_Cinossu_SHC2013.bin",
      
      "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/please_do_not_mind_about_this_folder/%5BSHC%5D%20%5Bexpo2020%5D%20213%20-%20SHC2020%20The%20Real%20Sonic%202%20(Credits%20to%20lavagaming1).bin",
      
      "https://cdn.jsdelivr.net/gh/sonic-hacks-repo/sonic-hacks-archive@master/sonic-1-mbv-michael-bay-vision-s1hack/Sonic_MBV_(Selbi)_(SHC2013).bin"
    ];

    // Function to reload the page
    function reloadPage() {
      location.reload();
    }

    // Attach click event to button
    document.getElementById("reload-btn").addEventListener("click", reloadPage);

    // Pick a random ROM on page load
    const randomRom = romList[Math.floor(Math.random() * romList.length)];

    // Configure EmulatorJS
    EJS_player = "#game";
    EJS_core = "segaMD";
    EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/";
    EJS_gameUrl = randomRom;
    loadGame();
  </script>
  <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js"></script>
</body>
</html>
