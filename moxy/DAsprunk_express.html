<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAsprunk Express</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/please_do_not_mind_about_this_folder/please_dont_dmca_(dumb_archives)/DSexpress_icon.png" type="image/vnd.microsoft.icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap" rel="stylesheet">
    
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    color: #fff;
    font-family: 'Love Ya Like A Sister', cursive;
    font-weight: normal;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-y: auto;
    padding: 2rem 1rem;
    gap: 2rem;
}

#top {
    text-align: center;
    animation: slideDown 0.6s ease-out;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#top img {
    max-width: 100%;
    height: auto;
    max-height: 180px;
    filter: drop-shadow(0 0 10px rgba(0, 255, 100, 0.3));
    transition: filter 0.3s ease;
}

#top img:hover {
    filter: drop-shadow(0 0 20px rgba(0, 255, 100, 0.6));
}

#top h1 {
    margin-top: 1.5rem;
    font-size: 2.5rem;
    color: #0f0;
    text-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
    letter-spacing: 1px;
    font-family: 'Love Ya Like A Sister', cursive;
}

#search-container {
    width: 100%;
    max-width: 900px;
    animation: fadeIn 0.8s ease-out 0.1s backwards;
}

#search-input {
    width: 100%;
    padding: 0.8rem 1rem;
    font-size: 1rem;
    font-family: 'Love Ya Like A Sister', cursive;
    background-color: rgba(30, 30, 30, 0.8);
    color: #0f0;
    border: 2px solid #0f0;
    border-radius: 0.5em;
    box-shadow: 0 0 10px rgba(0, 255, 100, 0.2), inset 0 0 10px rgba(0, 255, 100, 0.05);
    transition: all 0.3s ease;
}

#search-input::placeholder {
    color: rgba(0, 255, 100, 0.5);
}

#search-input:focus {
    outline: none;
    box-shadow: 0 0 20px rgba(0, 255, 100, 0.5), inset 0 0 10px rgba(0, 255, 100, 0.1);
    border-color: #0f0;
}

#search-input:focus::placeholder {
    color: rgba(0, 255, 100, 0.3);
}

#box {
    width: 100%;
    max-width: 900px;
    padding: 2rem;
    background-color: rgba(30, 30, 30, 0.8);
    border: 2px solid #0f0;
    border-radius: 0.6em;
    color: #aaa;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 1rem;
    animation: fadeIn 0.8s ease-out 0.2s backwards;
    box-shadow: 0 0 20px rgba(0, 255, 100, 0.2), inset 0 0 20px rgba(0, 255, 100, 0.05);
}

#no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 2rem;
    color: #0f0;
    font-size: 1.2rem;
    display: none;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.game-btn {
    padding: 1rem;
    font-size: 1rem;
    font-family: 'Helvetica, sans-serif';
    font-weight: normal;
    background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
    color: #aaa;
    border: 2px solid #555;
    border-radius: 0.5em;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-wrap: break-word;
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
}

.game-btn.hidden {
    display: none;
}

.game-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0, 255, 100, 0.1) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.game-btn:hover {
    background: linear-gradient(135deg, #0f0 0%, #00aa44 100%);
    color: #000;
    border-color: #0f0;
    box-shadow: 0 0 15px rgba(0, 255, 100, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
}

.game-btn:hover::before {
    opacity: 1;
}

.game-btn:active {
    transform: translateY(0);
    box-shadow: 0 0 10px rgba(0, 255, 100, 0.4), inset 0 0 10px rgba(0, 255, 100, 0.2);
}

.game-btn:focus-visible {
    outline: 2px solid #0f0;
    outline-offset: 2px;
}

/* ===== GAME MODAL STYLES ===== */

.game-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1rem;
    animation: fadeIn 0.3s ease-out;
}

.game-modal.hidden {
    display: none;
}

.game-modal-content {
    background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    border: 2px solid #0f0;
    border-radius: 0.8em;
    box-shadow: 0 0 30px rgba(0, 255, 100, 0.4), 0 0 60px rgba(0, 255, 100, 0.2);
    width: 90%;
    max-width: 1200px;
    height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.game-modal-header {
    padding: 1.5rem;
    border-bottom: 2px solid #0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

.game-modal-header h2 {
    font-size: 1.8rem;
    color: #0f0;
    text-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
    margin: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.game-modal-controls {
    padding: 1rem 1.5rem;
    border-bottom: 2px solid #0f0;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    flex-shrink: 0;
}

.modal-btn {
    padding: 0.6rem 1.2rem;
    font-family: 'Love Ya Like A Sister', cursive;
    font-size: 0.95rem;
    background: linear-gradient(135deg, #0f0 0%, #00aa44 100%);
    color: #000;
    border: none;
    border-radius: 0.4em;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: normal;
    box-shadow: 0 0 10px rgba(0, 255, 100, 0.4);
}

.modal-btn:hover {
    box-shadow: 0 0 20px rgba(0, 255, 100, 0.7);
    transform: translateY(-2px);
}

.modal-btn:active {
    transform: translateY(0);
}

.modal-btn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

.modal-close-btn {
    padding: 0.6rem 1rem;
    min-width: auto;
    background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
    flex-shrink: 0;
}

.modal-close-btn:hover {
    box-shadow: 0 0 20px rgba(255, 68, 68, 0.7);
}

.game-container {
    flex: 1;
    display: flex;
    overflow: hidden;
    background-color: #000;
}

.game-iframe {
    width: 100%;
    height: 100%;
    border: none;
    background-color: #000;
}

/* ===== FULLSCREEN STYLES ===== */

.game-iframe:fullscreen {
    width: 100%;
    height: 100%;
}

/* For different browser prefixes */
.game-iframe:-webkit-full-screen {
    width: 100%;
    height: 100%;
}

.game-iframe:-moz-full-screen {
    width: 100%;
    height: 100%;
}

.game-iframe:-ms-fullscreen {
    width: 100%;
    height: 100%;
}

/* ===== MOBILE OPTIMIZATION ===== */

@media (max-width: 600px) {
    body {
        padding: 1.5rem 1rem;
        gap: 1.5rem;
    }

    #top h1 {
        font-size: 2rem;
    }

    #box {
        grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        padding: 1.5rem;
        gap: 0.8rem;
    }

    .game-btn {
        font-size: 0.9rem;
        padding: 0.8rem;
    }

    #search-input {
        font-size: 1rem;
        padding: 0.7rem 0.9rem;
    }

    .game-modal-content {
        width: 95%;
        height: 90vh;
    }

    .game-modal-header {
        padding: 1rem;
    }

    .game-modal-header h2 {
        font-size: 1.3rem;
    }

    .game-modal-controls {
        padding: 0.8rem 1rem;
        gap: 0.5rem;
    }

    .modal-btn {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
    }
}

/* ===== SCROLLBAR STYLING ===== */

#box::-webkit-scrollbar {
    width: 8px;
}

#box::-webkit-scrollbar-track {
    background: rgba(0, 255, 100, 0.1);
    border-radius: 10px;
}

#box::-webkit-scrollbar-thumb {
    background: rgba(0, 255, 100, 0.4);
    border-radius: 10px;
    transition: background 0.3s ease;
}

#box::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 255, 100, 0.7);
}
    </style>
</head>

<body>
    <div id="top">
        <img src="https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/please_do_not_mind_about_this_folder/please_dont_dmca_(dumb_archives)/DSexpress_logo.png" alt="DAsprunk Express Logo" width="455" height="199">
        <h1><span style="color: #ffffff;">Oh hi, I'm just a lil pop star</span></h1>
    </div>

    <div id="search-container">
        <input 
            type="text" 
            id="search-input" 
            placeholder="Search games..." 
            aria-label="Search games"
        >
    </div>

    <div id="box" role="region" aria-label="Game launcher buttons">
        <div id="no-results">No games found matching your search.</div>
    </div>

    <!-- Game Viewer Modal -->
    <div id="game-modal" class="game-modal hidden">
        <div class="game-modal-content">
            <div class="game-modal-header">
                <h2 id="game-modal-title">Game Title</h2>
                <button id="modal-close-btn" class="modal-btn modal-close-btn" aria-label="Close game window">✕</button>
            </div>
            <div class="game-modal-controls">
                <button id="fullscreen-btn" class="modal-btn" aria-label="Toggle fullscreen">⛶ Fullscreen</button>
                <button id="download-btn" class="modal-btn" aria-label="Download game HTML">⬇ Download</button>
                <button id="new-tab-btn" class="modal-btn" aria-label="Open in new tab">🔗 New Tab</button>
            </div>
            <div id="game-container" class="game-container">
                <iframe id="game-iframe" class="game-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" title="Game viewer"></iframe>
            </div>
        </div>
    </div>


    <script>
          // Game data - single source of truth
const games = [
    { name: "Cory in the house", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clcoryinthehouse.html" },
    { name: "Deltarune", url: "https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/index.html" },
    { name: "Doki Doki Literature Club", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/cldokidokiliteratureclub_modified.html" },
    { name: "FNF Doki Doki Takeover", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clfnfdokitakeoverplus.html" },
    { name: "Sprunked", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clsprunked.html" },
    { name: "Sonic Classic Heroes", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/sonic_classic_heroes.html" },
    { name: "Undertale", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the-diesmos-fridge/undertale-diesmos.html" },
    { name: "UNDERTALE 10TH ANNIVERSARY", url: "https://cdn.jsdelivr.net/gh/elite-gamez/elite-gamez.github.io@main/g/UNDERTALE%2010th%20Anniversary.html" },
    { name: "Youtube unbl0cker", url: "https://cdn.jsdelivr.net/gh/3kh0Games/YoutubeUnblocked.Github.io@main/index.html" },
    { name: "Sonic Megamix", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/retro/megamix4.html" },
    { name: "Blue Vortex", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clvortex.html" },
    { name: "Bleach VS Naruto", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clbleachvsnaruto.html" },
    { name: "$cratch", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clscratchoptions.html" },
    { name: "Cold Front", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clcoldfront.html" },
    { name: "Yohoho i0", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clyohohoio.html" },
    { name: "I HATE YOU", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/the_depths_of_UGS/clihateyou.html" },
    { name: "Sonic 1 ROM Hack Roulette", url: "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/iamthegamesofsprunk.github.io@main/moxy/s1rhr_reboot.html" }
];

// DOM Elements
const gameContainer = document.getElementById("box");
const noResults = document.getElementById("no-results");
const searchInput = document.getElementById("search-input");
const gameModal = document.getElementById("game-modal");
const gameModalContent = document.querySelector(".game-modal-content");
const gameModalTitle = document.getElementById("game-modal-title");
const gameIframe = document.getElementById("game-iframe");
const modalCloseBtn = document.getElementById("modal-close-btn");
const fullscreenBtn = document.getElementById("fullscreen-btn");
const downloadBtn = document.getElementById("download-btn");
const newTabBtn = document.getElementById("new-tab-btn");

// State
const gameButtons = {};
let currentGameData = null;
let currentGameHTML = null;
let isFullscreen = false;

// ===== GAME LOADING & MODAL ===== 

async function openGameInModal(gameName, gameUrl) {
    try {
        // Show loading state
        gameIframe.src = "about:blank";
        gameModalTitle.textContent = `Loading ${gameName}...`;
        gameModal.classList.remove("hidden");
        
        // Fetch game HTML
        const response = await fetch(gameUrl + "?t=" + Date.now());
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const gameHTML = await response.text();
        
        // Store data for other buttons
        currentGameData = { name: gameName, url: gameUrl };
        currentGameHTML = gameHTML;
        
        // Update modal title
        gameModalTitle.textContent = gameName;
        
        // Inject HTML into iframe
        gameIframe.srcdoc = gameHTML;
        
    } catch (error) {
        console.error("Error loading game:", error);
        gameModalTitle.textContent = `Error loading ${gameName}`;
        gameIframe.srcdoc = `<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #f00; font-family: Arial, sans-serif; font-size: 18px;">Failed to load game. Please try again.</div>`;
    }
}

function closeModal() {
    // Exit fullscreen if active
    if (isFullscreen) {
        exitFullscreen();
    }
    
    gameModal.classList.add("hidden");
    gameIframe.srcdoc = "";
    currentGameData = null;
    currentGameHTML = null;
    isFullscreen = false;
    fullscreenBtn.textContent = "⛶ Fullscreen";
}

async function toggleFullscreen() {
    try {
        if (!isFullscreen) {
            // Enter fullscreen
            if (gameIframe.requestFullscreen) {
                await gameIframe.requestFullscreen();
            } else if (gameIframe.webkitRequestFullscreen) {
                await gameIframe.webkitRequestFullscreen();
            } else if (gameIframe.mozRequestFullScreen) {
                await gameIframe.mozRequestFullScreen();
            } else if (gameIframe.msRequestFullscreen) {
                await gameIframe.msRequestFullscreen();
            }
            isFullscreen = true;
            fullscreenBtn.textContent = "⛶ Exit Fullscreen";
        } else {
            // Exit fullscreen
            exitFullscreen();
        }
    } catch (error) {
        console.error("Fullscreen request failed:", error);
        alert("Fullscreen not supported or permission denied.");
    }
}

function exitFullscreen() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
    } else if (document.mozFullScreenElement) {
        document.mozCancelFullScreen();
    } else if (document.msFullscreenElement) {
        document.msExitFullscreen();
    }
    
    isFullscreen = false;
    fullscreenBtn.textContent = "⛶ Fullscreen";
}

// Listen for fullscreen change events
document.addEventListener("fullscreenchange", handleFullscreenChange);
document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
document.addEventListener("mozfullscreenchange", handleFullscreenChange);
document.addEventListener("msfullscreenchange", handleFullscreenChange);

function handleFullscreenChange() {
    const fullscreenElement = document.fullscreenElement || 
                             document.webkitFullscreenElement || 
                             document.mozFullScreenElement || 
                             document.msFullscreenElement;
    
    if (!fullscreenElement) {
        // Exited fullscreen
        isFullscreen = false;
        fullscreenBtn.textContent = "⛶ Fullscreen";
    }
}

function downloadGameHTML() {
    if (!currentGameHTML || !currentGameData) {
        console.error("No game data available to download");
        return;
    }
    
    const element = document.createElement("a");
    const file = new Blob([currentGameHTML], { type: "text/html" });
    element.href = URL.createObjectURL(file);
    element.download = `${currentGameData.name.replace(/\s+/g, "_")}.html`;
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
    URL.revokeObjectURL(element.href);
}

function openInNewTab() {
    if (!currentGameHTML || !currentGameData) {
        console.error("No game data available");
        return;
    }
    
    const newWin = window.open("about:blank", "_blank");
    if (newWin) {
        newWin.document.open();
        newWin.document.write(currentGameHTML);
        newWin.document.close();
    } else {
        console.warn("Pop-up was blocked. Please allow pop-ups for this site.");
    }
}

// ===== EVENT LISTENERS =====

modalCloseBtn.addEventListener("click", closeModal);
fullscreenBtn.addEventListener("click", toggleFullscreen);
downloadBtn.addEventListener("click", downloadGameHTML);
newTabBtn.addEventListener("click", openInNewTab);

// Close modal when clicking outside the modal content
gameModal.addEventListener("click", (e) => {
    if (e.target === gameModal) {
        closeModal();
    }
});

// Close modal with Escape key (but not if fullscreen - Escape naturally exits fullscreen)
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !gameModal.classList.contains("hidden") && !isFullscreen) {
        closeModal();
    }
});

// ===== RENDER GAME BUTTONS =====

games.forEach((game) => {
    const button = document.createElement("button");
    button.className = "game-btn";
    button.textContent = game.name;
    button.onclick = () => openGameInModal(game.name, game.url);
    button.setAttribute("aria-label", `Launch ${game.name}`);
    gameContainer.insertBefore(button, noResults);
    gameButtons[game.name.toLowerCase()] = button;
});

// ===== SEARCH FUNCTIONALITY =====

searchInput.addEventListener("input", (e) => {
    const query = e.target.value.toLowerCase().trim();
    let visibleCount = 0;

    games.forEach((game) => {
        const button = gameButtons[game.name.toLowerCase()];
        const matches = game.name.toLowerCase().includes(query);

        if (matches && query.length > 0) {
            button.classList.remove("hidden");
            visibleCount++;
        } else if (query.length === 0) {
            button.classList.remove("hidden");
            visibleCount++;
        } else {
            button.classList.add("hidden");
        }
    });

    // Show "no results" message if nothing matches
    noResults.style.display = visibleCount === 0 && query.length > 0 ? "block" : "none";
    
    // Create a blob URL from the gameHTML string
const blob = new Blob([gameHTML], { type: 'text/html' });
gameIframe.src = URL.createObjectURL(blob);

// Update closeModal to handle blob URL cleanup
function closeModal() {
    // Clean up the blob URL when closing the modal
    URL.revokeObjectURL(gameIframe.src);
    // Additional close modal logic here
}
});
</script>
</body>
</html>
